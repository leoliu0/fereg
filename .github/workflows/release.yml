name: release

# Tag vX.Y.Z: builds and smoke-tests every artifact, then publishes the Stata net-install tree
# (gh-pages), a GitHub Release with all artifacts and, when the repository variable PYPI_PUBLISH
# is 'true', the Python wheels and sdist to PyPI (trusted publishing, environment `pypi`).
# Manual runs (workflow_dispatch) default to dry_run: everything is built and tested, nothing is
# published. Publishing also requires a tag ref, so a branch run never publishes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and smoke-test every artifact without publishing anything
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag, Cargo, R package and Stata versions agree
        id: check
        run: |
          version=$(sh scripts/check-versions.sh ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }})
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release version $version"

  # ---------------------------------------------------------------------------------------------
  # Stata plugins
  # ---------------------------------------------------------------------------------------------
  linux:
    needs: version
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal

      - name: Build
        run: |
          . "$HOME/.cargo/env"
          cargo build --release -p fereg-stata
          cp target/release/libfereg_stata.so fereg.linux64.plugin

      - name: glibc floor (<= 2.28)
        run: |
          max=$(objdump -T fereg.linux64.plugin | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "highest glibc symbol: $max"
          test "$(printf '%s\nGLIBC_2.28\n' "$max" | sort -V | tail -1)" = "GLIBC_2.28"

      - name: Mock host
        run: |
          . "$HOME/.cargo/env"
          cargo run --release -p fereg-core --example mock_expected
          cc -O2 -DSYSTEM=OPUNIX -Icrates/fereg-stata/c tests/mockhost/mockhost.c -ldl -o target/mockhost
          target/mockhost ./fereg.linux64.plugin

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-linux
          path: fereg.linux64.plugin

  macos:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build universal plugin
        run: |
          MACOSX_DEPLOYMENT_TARGET=11.0 cargo build --release -p fereg-stata --target aarch64-apple-darwin
          MACOSX_DEPLOYMENT_TARGET=10.13 cargo build --release -p fereg-stata --target x86_64-apple-darwin
          lipo -create -output fereg.macos-universal.plugin \
            target/aarch64-apple-darwin/release/libfereg_stata.dylib \
            target/x86_64-apple-darwin/release/libfereg_stata.dylib
          codesign --force -s - fereg.macos-universal.plugin
          lipo -info fereg.macos-universal.plugin

      - name: Mock host (arm64)
        run: |
          cargo run --release -p fereg-core --example mock_expected
          cc -O2 -DSYSTEM=OPUNIX -Icrates/fereg-stata/c tests/mockhost/mockhost.c -o target/mockhost
          target/mockhost ./fereg.macos-universal.plugin

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-macos
          path: fereg.macos-universal.plugin

  windows:
    needs: version
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        shell: bash
        run: |
          cargo build --release -p fereg-stata --target x86_64-pc-windows-msvc
          cp target/x86_64-pc-windows-msvc/release/fereg_stata.dll fereg.win64.plugin

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Mock host
        shell: cmd
        run: |
          cargo run --release -p fereg-core --example mock_expected
          cl /nologo /O2 /DSYSTEM=STWIN32 /Icrates\fereg-stata\c tests\mockhost\mockhost.c /Fe:target\mockhost.exe
          target\mockhost.exe fereg.win64.plugin

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-windows
          path: fereg.win64.plugin

  stata-dist:
    needs: [version, linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: plugin-*
          path: artifacts
          merge-multiple: true

      - name: Assemble net-install tree
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist/stata
          cp stata/*.ado stata/*.sthlp stata/stata.toc dist/stata/
          sed "s/^d Distribution-Date: .*/d Distribution-Date: $(date -u +%Y%m%d)/" stata/fereg.pkg > dist/stata/fereg.pkg
          cp artifacts/fereg.linux64.plugin artifacts/fereg.macos-universal.plugin artifacts/fereg.win64.plugin dist/stata/
          ls -l dist/stata
          (cd dist && zip -r "../fereg-v${VERSION}-stata.zip" stata)

      - uses: actions/upload-artifact@v7
        with:
          name: stata-net-install
          path: dist
      - uses: actions/upload-artifact@v7
        with:
          name: stata-zip
          path: fereg-v${{ needs.version.outputs.version }}-stata.zip

  # ---------------------------------------------------------------------------------------------
  # Python: wheels for CPython 3.10-3.14 on 5 platforms, sdist
  # ---------------------------------------------------------------------------------------------
  wheels:
    needs: version
    name: wheels (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04, target: x86_64 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64 }
          - { platform: macos-arm64, runner: macos-15, target: aarch64 }
          - { platform: macos-x86_64, runner: macos-15-intel, target: x86_64 }
          - { platform: windows-x64, runner: windows-2025, target: x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # Linux builds run in the manylinux_2_28 container, which has every CPython; elsewhere the
      # interpreters come from setup-python.
      - uses: actions/setup-python@v7
        if: runner.os != 'Linux'
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14

      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          manylinux: "2_28"
          working-directory: python
          args: >-
            --release --locked --out dist --compatibility pypi
            ${{ runner.os == 'Linux' && '-i python3.10 python3.11 python3.12 python3.13 python3.14' || '--find-interpreter' }}

      - name: One wheel per CPython 3.10-3.14
        shell: bash
        run: |
          ls -l python/dist
          test "$(ls python/dist/*.whl | wc -l)" -eq 5
          for v in 310 311 312 313 314; do ls python/dist/fereg-*-cp$v-cp$v-*.whl; done

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform }}
          path: python/dist/*.whl

  sdist:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          command: sdist
          working-directory: python
          args: --out dist
      - run: ls -l python/dist && tar -tzf python/dist/fereg-*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: python/dist/fereg-*.tar.gz

  wheel-smoke:
    needs: [version, wheels]
    name: wheel smoke (${{ matrix.platform }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        platform: [linux-x86_64, linux-aarch64, macos-arm64, macos-x86_64, windows-x64]
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm }
          - { platform: macos-arm64, runner: macos-15 }
          - { platform: macos-x86_64, runner: macos-15-intel }
          - { platform: windows-x64, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: wheels-${{ matrix.platform }}
          path: wheels
      - name: Install the wheel (no build from source) and run a tiny feols
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary :all: numpy pandas
          python -m pip install --no-index --find-links wheels --only-binary :all: fereg
          cd "$RUNNER_TEMP" && python "$GITHUB_WORKSPACE/scripts/smoke_python.py" "${{ needs.version.outputs.version }}"

  sdist-smoke:
    needs: [version, sdist]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          name: wheels-sdist
          path: sdist
      - name: Build from the sdist outside the repository and run a tiny feols
        run: |
          python -m pip install --upgrade pip
          cp sdist/fereg-*.tar.gz "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          python -m pip install -v fereg-*.tar.gz
          python "$GITHUB_WORKSPACE/scripts/smoke_python.py" "${{ needs.version.outputs.version }}"

  # ---------------------------------------------------------------------------------------------
  # R: source tarball with vendored crates (offline install), binaries for macOS and Windows
  # ---------------------------------------------------------------------------------------------
  r-source:
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Build the source tarball (fereg-core copied in, crates vendored)
        run: |
          sh scripts/sync-core.sh
          sh r/fereg/tools/vendor-crates.sh
          R CMD build r/fereg
          ls -l fereg_${VERSION}.tar.gz
          tar -tzf fereg_${VERSION}.tar.gz | grep -x fereg/src/rust/vendor.tar.xz
          tar -tzf fereg_${VERSION}.tar.gz | grep -x fereg/src/rust/fereg-core/Cargo.toml

      # The Makevars build offline from vendor.tar.xz with an empty CARGO_HOME; the proxy
      # settings make any network access by cargo fail.
      - name: Install offline and run a tiny feols
        env:
          CARGO_NET_OFFLINE: "true"
          http_proxy: http://127.0.0.1:9
          https_proxy: http://127.0.0.1:9
        run: |
          mkdir -p "$RUNNER_TEMP/rlib"
          R CMD INSTALL -l "$RUNNER_TEMP/rlib" fereg_${VERSION}.tar.gz
          R_LIBS="$RUNNER_TEMP/rlib" Rscript scripts/smoke_r.R "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: r-source
          path: fereg_${{ needs.version.outputs.version }}.tar.gz

  r-binary:
    needs: [version, r-source]
    name: R binary (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-arm64, runner: macos-15, ext: tgz }
          - { platform: macos-x86_64, runner: macos-15-intel, ext: tgz }
          - { platform: windows-x64, runner: windows-2025, ext: zip }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # Windows R builds with Rtools (GNU ABI): the Rust target is x86_64-pc-windows-gnu.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-gnu' || '' }}
      - uses: r-lib/actions/setup-r@v2
      - uses: actions/download-artifact@v8
        with:
          name: r-source

      - name: R CMD INSTALL --build
        run: |
          mkdir -p buildlib
          R CMD INSTALL --build -l buildlib fereg_${VERSION}.tar.gz
          rver=$(Rscript -e 'cat(R.version$major, sub("[.].*", "", R.version$minor), sep = ".")')
          out="fereg_${VERSION}_R${rver}_${{ matrix.platform }}.${{ matrix.ext }}"
          mv "fereg_${VERSION}.${{ matrix.ext }}" "$out"
          ls -l "$out"
          echo "R_BINARY=$out" >> "$GITHUB_ENV"

      - name: Install the binary into a fresh library and run a tiny feols
        run: |
          mkdir -p smokelib
          Rscript -e 'install.packages(Sys.getenv("R_BINARY"), lib = "smokelib", repos = NULL, type = "binary")'
          R_LIBS="$PWD/smokelib" Rscript scripts/smoke_r.R "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: r-binary-${{ matrix.platform }}
          path: ${{ env.R_BINARY }}

  # ---------------------------------------------------------------------------------------------
  # Collect, then publish (tags only; never on dry runs)
  # ---------------------------------------------------------------------------------------------
  assemble:
    needs: [version, stata-dist, wheel-smoke, sdist-smoke, r-source, r-binary]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: collected
      - name: Every release asset is present
        run: |
          mkdir release
          cp collected/stata-zip/*.zip collected/wheels-*/* collected/r-source/* collected/r-binary-*/* release/
          ls -l release
          count() { n=$(ls release | grep -c -E "$2" || true); echo "$1: $n (expected $3)"; [ "$n" -eq "$3" ]; }
          ok=0
          count "Stata zip" "^fereg-v${VERSION}-stata\.zip$" 1 || ok=1
          count "wheels" "^fereg-${VERSION}-cp31[0-4]-cp31[0-4]-.*\.whl$" 25 || ok=1
          count "sdist" "^fereg-${VERSION}\.tar\.gz$" 1 || ok=1
          count "R source" "^fereg_${VERSION}\.tar\.gz$" 1 || ok=1
          count "R binaries" "^fereg_${VERSION}_R[0-9.]+_(macos-arm64|macos-x86_64|windows-x64)\.(tgz|zip)$" 3 || ok=1
          unzip -l release/fereg-v${VERSION}-stata.zip | grep -c -E 'fereg\.(linux64|macos-universal|win64)\.plugin$' | grep -qx 3 || { echo "Stata zip lacks a plugin"; ok=1; }
          test "$(ls release | wc -l)" -eq 31 || { echo "unexpected extra files"; ok=1; }
          exit $ok
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release

  publish:
    needs: [version, assemble]
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.dry_run == false)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: stata-net-install
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          keep_files: false

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*

  pypi:
    needs: [version, assemble]
    if: vars.PYPI_PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.dry_run == false)
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/fereg/${{ needs.version.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
