[package]
name = "fereg"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["staticlib"]
name = "fereg"

[dependencies]
extendr-api = { version = "=0.9.0", features = ["result_condition"] }
fereg-core = { path = "fereg-core" }
rayon = "1.12"
# Only for `faer::set_global_parallelism` (features come from fereg-core).
faer = { version = "0.24", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"

# This crate is its own workspace root, isolated from the repository workspace.
[workspace]
