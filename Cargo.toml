[workspace]
members = ["crates/fereg-core", "crates/fereg-stata", "crates/fereg-py"]
# The R package's Rust crate is its own workspace (built by R CMD INSTALL).
exclude = ["r"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.5.0"
# Minimum supported Rust version (edition 2024); the R package checks it in configure.
rust-version = "1.85"
license = "MIT"
authors = ["Leo Liu <auleo.liu@gmail.com>"]
repository = "https://github.com/leoliu0/fereg"

[workspace.dependencies]
rayon = "1.12"
# Without the default `npy` and `rand` features (unused): fewer crates to vendor in the R package.
faer = { version = "0.24", default-features = false, features = ["std", "rayon", "sparse-linalg"] }
approx-chol = "=0.6.0"

# Shipped plugin and benchmarks: maximum optimisation.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"

# `cargo build --profile profiling` for perf/samply.
[profile.profiling]
inherits = "release"
debug = true

# Fast test iteration: our crates at -O1, dependencies fully optimised.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
